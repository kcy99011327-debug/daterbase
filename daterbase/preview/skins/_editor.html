<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>테마 편집기</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;700&family=Jua&family=IBM+Plex+Sans+KR:wght@400;600&family=Noto+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ui-bg:#ecebe7;--ui-card:#fff;--ui-fg:#222;--ui-mut:#888;--ui-line:#dcdad4;--ui-ac:#3b5bdb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ui-bg:#1b1b1d;--ui-card:#26262a;--ui-fg:#eee;--ui-mut:#999;--ui-line:#3a3a40;--ui-ac:#7c94ff}}
:root[data-theme="dark"]{--ui-bg:#1b1b1d;--ui-card:#26262a;--ui-fg:#eee;--ui-mut:#999;--ui-line:#3a3a40;--ui-ac:#7c94ff}
*{box-sizing:border-box}
body{margin:0;background:var(--ui-bg);color:var(--ui-fg);font:14px/1.5 "Noto Sans KR",system-ui,sans-serif;word-break:keep-all;overflow-x:hidden}
#fitwrap{width:100%;overflow:hidden}
#root{width:1280px;transform-origin:0 0;padding:16px;display:grid;grid-template-columns:1fr 340px;gap:16px}
.top{grid-column:1/-1;display:flex;align-items:center;gap:8px;background:var(--ui-card);border:1px solid var(--ui-line);border-radius:12px;padding:10px 16px}
.top h1{font-size:16px;margin:0 12px 0 0;white-space:nowrap}
.top .sp{flex:1}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--ui-line);background:var(--ui-card);border-radius:8px;padding:6px 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.on{background:var(--ui-ac);color:#fff;border-color:var(--ui-ac)}
.btn.pri{background:var(--ui-fg);color:var(--ui-card);border-color:var(--ui-fg)}
.seg{display:inline-flex;border:1px solid var(--ui-line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 12px}.seg button.on{background:var(--ui-ac);color:#fff}
/* 무대 */
.stage{background:var(--ui-card);border:1px solid var(--ui-line);border-radius:12px;padding:16px;overflow:auto}
#app{width:100%;height:560px;display:grid;grid-template-columns:var(--sb-w) 1fr;background:var(--bg);background-image:var(--bg-img);background-size:cover;background-position:center;color:var(--fg);font-family:var(--font);font-size:var(--fs);border-radius:10px;overflow:hidden;position:relative}
#app [data-k]{cursor:pointer;outline:2px dashed transparent;outline-offset:-2px;transition:outline-color .1s}
#app [data-k]:hover{outline-color:var(--ui-ac)}
#app [data-k].sel{outline:2px solid var(--ui-ac)}
.sb{background:var(--sb-bg);background-image:var(--sb-img);background-size:cover;padding:16px 10px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line)}
.sb .logo{font-family:var(--font-h);font-weight:700;font-size:1.15em;padding:4px 8px 12px}
.sb .it{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r-s);color:var(--fg)}
.sb .it .ic{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;line-height:1}
.sb .it.on{background:var(--accent);color:var(--on-accent)}
.main{padding:var(--gap);display:grid;grid-template-columns:1.5fr 1fr;grid-template-rows:auto 1fr;gap:var(--gap);overflow:hidden}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;overflow:hidden;box-shadow:var(--shadow)}
.blk h3{margin:0 0 10px;font-family:var(--font-h);font-size:1.05em}
.hello{grid-column:1/-1;display:flex;align-items:center;gap:12px}
.hello .big{font-family:var(--font-h);font-size:1.6em;font-weight:700}
.hello .mut{color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .d{background:var(--surface-2);border-radius:calc(var(--r-s) - 2px);height:52px;padding:4px 6px;font-size:.82em;color:var(--muted);overflow:hidden}
.cal .d.today{background:var(--day-head);color:var(--day-on)}
.cal .chip{display:block;margin-top:3px;background:var(--nolb);color:var(--nolb-on);border-radius:4px;padding:0 4px;font-size:.85em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo{display:flex;flex-direction:column;gap:8px}
.todo label{display:flex;gap:8px;align-items:center}
.todo .bx{width:16px;height:16px;border:1.5px solid var(--accent);border-radius:4px;flex:none}
.todo .bx.ok{background:var(--accent)}
.todo .done{color:var(--muted);text-decoration:line-through}
.memo{background:var(--mm-bg);background-image:var(--mm-img);background-size:cover;border-radius:var(--r-s);padding:14px 16px;margin-top:12px;transform:rotate(-1.5deg);box-shadow:0 2px 6px #0002;font-family:var(--font-m)}
.pbtn{margin-top:12px;background:var(--accent);color:var(--on-accent);border:0;border-radius:var(--r-s);padding:8px 14px;display:inline-flex;align-items:center;justify-content:center}
.deco{position:absolute;pointer-events:none;background-size:contain;background-repeat:no-repeat}
/* 패널 */
.panel{background:var(--ui-card);border:1px solid var(--ui-line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;max-height:calc(560px + 34px);overflow:auto}
.panel h2{margin:0;font-size:15px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--ui-line);background:none;border-radius:999px;padding:4px 12px}
.tabs button.on{background:var(--ui-fg);color:var(--ui-card);border-color:var(--ui-fg)}
.row{display:flex;align-items:center;gap:10px;min-height:34px}
.row>span{width:84px;flex:none;color:var(--ui-mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row input[type=range]{flex:1}
.row select,.row input[type=text]{flex:1;font:inherit;padding:5px 8px;border:1px solid var(--ui-line);border-radius:6px;background:var(--ui-card);color:var(--ui-fg);min-width:0}
.sw{width:26px;height:26px;border-radius:50%;border:1px solid #0003;padding:0;position:relative;flex:none}
.sw.lk::after{content:"🔗";position:absolute;right:-6px;bottom:-6px;font-size:11px}
.sw .warn{position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:#e03131}
.pal{display:flex;flex-wrap:wrap;gap:6px}
.pal button{width:24px;height:24px;border-radius:50%;border:1px solid #0002;padding:0}
.pal .free{width:auto;border-radius:999px;padding:0 10px;background:none;border-color:var(--ui-line)}
.strip{display:flex;flex-wrap:wrap;gap:8px}
.drop{border:1.5px dashed var(--ui-line);border-radius:10px;padding:16px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ui-mut);text-align:center;min-height:64px}
.thumb{width:100%;height:80px;border-radius:8px;background-size:cover;background-position:center;border:1px solid var(--ui-line)}
.ics{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.ics button{height:34px;border:1px solid var(--ui-line);background:none;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px}
.ics button.on{border-color:var(--ui-ac);background:color-mix(in srgb,var(--ui-ac) 14%,transparent)}
textarea{width:100%;font:12px/1.4 ui-monospace,monospace;border:1px solid var(--ui-line);border-radius:8px;padding:10px;background:var(--ui-bg);color:var(--ui-fg);resize:vertical;min-height:70px;word-break:break-all}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:9}
.modal.on{display:flex}
.modal .box{background:var(--ui-card);border-radius:14px;padding:18px;width:440px;max-width:calc(100vw - 32px);display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;border-radius:10px;padding:10px 16px;display:none;gap:12px;align-items:center;z-index:10}
.toast.on{display:flex}.toast button{background:none;border:0;color:#9cf;font-weight:600}
.ctx{position:fixed;background:var(--ui-card);border:1px solid var(--ui-line);border-radius:10px;box-shadow:0 6px 20px #0003;padding:6px;display:none;z-index:11;min-width:160px}
.ctx.on{display:block}.ctx button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px}
.ctx button:hover{background:var(--ui-bg)}.ctx hr{border:0;border-top:1px solid var(--ui-line);margin:4px 0}
</style></head><body>
<div id="fitwrap"><div id="root">
  <div class="top">
    <h1>테마 편집기</h1>
    <div class="seg" id="mode"><button data-m="light" class="on">☀</button><button data-m="dark">☾</button></div>
    <div class="seg" id="base"></div>
    <span class="sp"></span>
    <button class="btn" id="undo">↶</button>
    <button class="btn" id="imp">코드 넣기</button>
    <button class="btn pri" id="exp">테마 코드 발급</button>
  </div>
  <div class="stage"><div id="app">
    <aside class="sb" data-k="sb">
      <div class="logo" data-k="logo">Daterbase</div>
      <div class="it on" data-k="nav"><span class="ic" data-ic="home"></span>홈</div>
      <div class="it" data-k="nav"><span class="ic" data-ic="cal"></span>달력</div>
      <div class="it" data-k="nav"><span class="ic" data-ic="todo"></span>할 일</div>
      <div class="it" data-k="nav"><span class="ic" data-ic="memo"></span>메모</div>
      <div class="it" data-k="nav"><span class="ic" data-ic="work"></span>업무</div>
      <div class="it" data-k="nav"><span class="ic" data-ic="set"></span>설정</div>
    </aside>
    <main class="main" data-k="bg">
      <div class="blk hello" data-k="blk"><span class="big" data-k="head">10월 30일 목요일</span><span class="mut" data-k="muted">오늘 할 일 3개</span></div>
      <div class="blk" data-k="blk"><h3 data-k="head">이번 주</h3>
        <div class="cal" id="cal"></div></div>
      <div class="blk" data-k="blk"><h3 data-k="head">할 일</h3>
        <div class="todo" data-k="fg">
          <label><i class="bx ok" data-k="accent"></i><span class="done">러프 스케치</span></label>
          <label><i class="bx"></i>채색 1차</label>
          <label><i class="bx"></i>의뢰인 답장</label></div>
        <div class="memo" data-k="memo">마감 전에 배경 한 번 더 보기</div>
        <button class="pbtn" data-k="accent">+ 추가</button>
      </div>
    </main>
  </div></div>
  <div class="panel" id="panel"></div>
</div></div>

<div class="modal" id="mExp"><div class="box">
  <h2>테마 코드 발급</h2>
  <div class="row"><span>받는 사람</span><input type="text" id="who" placeholder="의뢰인 이름"></div>
  <div class="row"><span>테마 이름</span><input type="text" id="tname" placeholder="예: 초여름 파일철"></div>
  <textarea id="code" readonly></textarea>
  <div class="row" style="justify-content:flex-end"><button class="btn" data-close>닫기</button><button class="btn pri" id="copy">복사</button></div>
</div></div>
<div class="modal" id="mImp"><div class="box">
  <h2>코드 넣기</h2>
  <textarea id="icode" placeholder="DBT1.…"></textarea>
  <div class="row" style="justify-content:flex-end"><button class="btn" data-close>닫기</button><button class="btn pri" id="apply">적용</button></div>
</div></div>
<div class="toast" id="toast"><span id="tmsg"></span><button id="tundo">되돌리기</button></div>
<div class="ctx" id="ctx"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
/* ---------- 색 계산 ---------- */
const hx=c=>{c=c.replace("#","");if(c.length==3)c=[...c].map(x=>x+x).join("");return[0,2,4].map(i=>parseInt(c.substr(i,2),16))};
const toH=a=>"#"+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join("");
const mix=(a,b,t)=>{let A=hx(a),B=hx(b);return toH(A.map((v,i)=>v+(B[i]-v)*t))};
const lum=c=>{let a=hx(c).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*a[0]+.7152*a[1]+.0722*a[2]};
const cr=(a,b)=>{let x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const onOf=c=>cr(c,"#ffffff")>=cr(c,"#1a1a1a")?"#ffffff":"#1a1a1a";
/* B안 12칸 + 따라가기 */
const COLS=[["bg","바탕"],["sb","사이드바"],["surface","블록"],["surface2","블록 안 칸"],["line","선"],["fg","글자"],["muted","흐린 글자"],["accent","강조"],["onAccent","강조 위 글자"],["dayHead","오늘 머리"],["nolb","라벨 없는 일정"],["mm","메모지"]];
const LB=Object.fromEntries(COLS);
const DER={sb:t=>t.bg,surface:t=>S.mode=="light"?"#ffffff":mix(t.bg,"#ffffff",.06),surface2:t=>mix(t.surface,t.bg,.35),line:t=>mix(t.surface,t.fg,.14),muted:t=>mix(t.fg,t.surface,.42),onAccent:t=>onOf(t.accent),dayHead:t=>t.accent,nolb:t=>mix(t.accent,t.surface,.55),mm:t=>mix(t.accent,"#fff8dc",.8)};
const BASES={
 gray:{nm:"기본 회색",light:{bg:"#f1f1ef",fg:"#2a2a2a",accent:"#4a4a4a"},dark:{bg:"#18181a",fg:"#e6e6e6",accent:"#bdbdbd"},pal:["#4a4a4a","#8a8a8a","#c9c9c4","#e05d44","#3b6fb6","#6a9a5b"]},
 file:{nm:"실험 파일철",light:{bg:"#F4DC5C",fg:"#1D4BA8",accent:"#1D4BA8",mm:"#fffbe6"},dark:{bg:"#141a2e",fg:"#f4dc5c",accent:"#f4dc5c"},pal:["#1D4BA8","#F4DC5C","#e8473c","#2f2f2f","#7aa2e3","#fff6c9"]},
 ink:{nm:"한지와 먹",light:{bg:"#f3efe6",fg:"#1f1d1a",accent:"#8a2b1f"},dark:{bg:"#161513",fg:"#ece6da",accent:"#d0715f"},pal:["#1f1d1a","#8a2b1f","#c9b99a","#5b6b5a","#e8e0cf","#b08d57"]}};
const FONTS=[["Noto Sans KR","본고딕"],["IBM Plex Sans KR","플렉스"],["Gowun Dodum","고운돋움"],["Nanum Myeongjo","명조"],["Jua","주아"]];
const ICONSETS={기본:{home:"⌂",cal:"▦",todo:"☑",memo:"✎",work:"✦",set:"⚙"},도형:{home:"●",cal:"■",todo:"▲",memo:"◆",work:"★",set:"✚"},손글씨:{home:"🏠",cal:"📅",todo:"✅",memo:"📝",work:"🎨",set:"🔧"},없음:{home:"",cal:"",todo:"",memo:"",work:"",set:""}};
const ICPICK=["⌂","▦","☑","✎","✦","⚙","●","■","▲","◆","★","✚","♡","☁","☾","✿","♪","☕","🍋","🐱","🌷","📼","🎞","🧸"];
/* ---------- 상태 ---------- */
const blank=()=>({base:"gray",col:{light:{},dark:{}},img:{bg:"",sb:"",mm:"",deco:"",decoX:78,decoY:70,decoW:140},font:{body:"Noto Sans KR",head:"Noto Sans KR",memo:"Noto Sans KR",fs:14},shape:{r:12,gap:16,sbw:170,shadow:0},icon:{set:"기본",own:{}}});
let T=blank(),S={mode:"light",sel:"bg",tab:"색"},hist=[];
function snap(){hist.push(JSON.stringify(T));if(hist.length>60)hist.shift()}
function full(){const B=BASES[T.base][S.mode],c=T.col[S.mode],t={};
 ["bg","fg","accent"].forEach(k=>t[k]=c[k]||B[k]);
 ["surface","sb","surface2","line","muted","onAccent","dayHead","nolb","mm"].forEach(k=>t[k]=c[k]||B[k]||DER[k](t));return t}
/* ---------- 칠하기 ---------- */
function paint(){const t=full(),a=$("#app").style,u=v=>v?`url(${v})`:"none";
 const map={bg:"--bg",sb:"--sb-bg",surface:"--surface",surface2:"--surface-2",line:"--line",fg:"--fg",muted:"--muted",accent:"--accent",onAccent:"--on-accent",dayHead:"--day-head",nolb:"--nolb",mm:"--mm-bg"};
 for(const k in map)a.setProperty(map[k],t[k]);
 a.setProperty("--day-on",onOf(t.dayHead));a.setProperty("--nolb-on",onOf(t.nolb));
 a.setProperty("--bg-img",u(T.img.bg));a.setProperty("--sb-img",u(T.img.sb));a.setProperty("--mm-img",u(T.img.mm));
 a.setProperty("--font",`"${T.font.body}"`);a.setProperty("--font-h",`"${T.font.head}"`);a.setProperty("--font-m",`"${T.font.memo}"`);a.setProperty("--fs",T.font.fs+"px");
 a.setProperty("--r",T.shape.r+"px");a.setProperty("--r-s",Math.max(2,T.shape.r*.6)+"px");a.setProperty("--gap",T.shape.gap+"px");a.setProperty("--sb-w",T.shape.sbw+"px");
 a.setProperty("--shadow",T.shape.shadow?`0 ${T.shape.shadow}px ${T.shape.shadow*3}px #0002`:"none");
 const set=ICONSETS[T.icon.set];$$("#app [data-ic]").forEach(e=>{const k=e.dataset.ic;e.textContent=T.icon.own[k]??set[k];e.style.display=e.textContent?"":"none"});
 let d=$("#deco");if(T.img.deco){if(!d){d=document.createElement("div");d.id="deco";d.className="deco";$("#app").append(d)}
  Object.assign(d.style,{backgroundImage:`url(${T.img.deco})`,left:T.img.decoX+"%",top:T.img.decoY+"%",width:T.img.decoW+"px",height:T.img.decoW+"px"})}else if(d)d.remove();
 $$("#base button").forEach(b=>b.classList.toggle("on",b.dataset.b==T.base));
 $$("#mode button").forEach(b=>b.classList.toggle("on",b.dataset.m==S.mode));
 $$("#app [data-k]").forEach(e=>e.classList.toggle("sel",e.dataset.k==S.sel));
 panel()}
/* 무대 요소 → 편집할 칸 */
const ZONE={bg:{t:"바탕",cols:["bg"],img:"bg"},sb:{t:"사이드바",cols:["sb","line"],img:"sb",tab:"모양"},logo:{t:"로고",cols:["fg"],font:"head"},nav:{t:"메뉴",cols:["accent","onAccent"],icon:1},blk:{t:"블록",cols:["surface","surface2","line"],tab:"모양"},head:{t:"제목",cols:["fg"],font:"head"},fg:{t:"글자",cols:["fg","muted"],font:"body"},muted:{t:"흐린 글자",cols:["muted"]},accent:{t:"강조",cols:["accent","onAccent"]},today:{t:"오늘",cols:["dayHead"]},chip:{t:"일정",cols:["nolb"]},memo:{t:"메모지",cols:["mm"],img:"mm",font:"memo"}};
/* ---------- 패널 ---------- */
function panel(){const z=ZONE[S.sel]||ZONE.bg,t=full(),P=$("#panel"),tabs=["색","이미지","글꼴","모양","아이콘"];
 let h=`<h2>${z.t}</h2><div class="tabs">${tabs.map(x=>`<button data-tab="${x}" class="${S.tab==x?"on":""}">${x}</button>`).join("")}</div>`;
 if(S.tab=="색"){
  h+=z.cols.map(k=>colRow(k,t)).join("");
  h+=`<div class="pal" id="pal">${palCols(t).map(c=>`<button style="background:${c}" data-c="${c}"></button>`).join("")}<label class="free btn">직접<input type="color" id="free" value="${t[S.pickK||z.cols[0]]}" style="width:0;height:0;opacity:0;position:absolute"></label></div>`;
  h+=`<div class="strip">${COLS.map(([k])=>`<button class="sw ${T.col[S.mode][k]?"":"lk"}" style="background:${t[k]}" data-k2="${k}" title="${LB[k]}">${warn(k,t)?'<i class="warn"></i>':""}</button>`).join("")}</div>`}
 if(S.tab=="이미지"){const slots=[["bg","바탕"],["sb","사이드바"],["mm","메모지"],["deco","스티커"]];
  h+=slots.map(([k,n])=>`<div class="row"><span>${n}</span>${T.img[k]?`<div class="thumb" style="background-image:url(${T.img[k]})" data-imgctx="${k}"></div>`:`<label class="drop" style="flex:1">＋<input type="file" accept="image/*" data-img="${k}" hidden></label>`}</div>`).join("");
  if(T.img.deco)h+=rng("decoX","가로",0,95,T.img.decoX,"img")+rng("decoY","세로",0,90,T.img.decoY,"img")+rng("decoW","크기",40,320,T.img.decoW,"img")}
 if(S.tab=="글꼴"){h+=[["body","본문"],["head","제목"],["memo","메모지"]].map(([k,n])=>`<div class="row"><span>${n}</span><select data-font="${k}">${FONTS.map(([f,l])=>`<option value="${f}" ${T.font[k]==f?"selected":""} style="font-family:'${f}'">${l}</option>`).join("")}</select></div>`).join("")+rng("fs","크기",12,17,T.font.fs,"font")}
 if(S.tab=="모양"){h+=rng("r","모서리",0,28,T.shape.r,"shape")+rng("gap","간격",8,28,T.shape.gap,"shape")+rng("sbw","사이드바 폭",130,240,T.shape.sbw,"shape")+rng("shadow","그림자",0,8,T.shape.shadow,"shape")}
 if(S.tab=="아이콘"){h+=`<div class="tabs">${Object.keys(ICONSETS).map(k=>`<button data-iset="${k}" class="${T.icon.set==k?"on":""}">${k}</button>`).join("")}</div>`;
  h+=["home","cal","todo","memo","work","set"].map(k=>{const cur=T.icon.own[k]??ICONSETS[T.icon.set][k];return `<div class="row"><span>${{home:"홈",cal:"달력",todo:"할 일",memo:"메모",work:"업무",set:"설정"}[k]}</span><button class="btn" data-icfor="${k}" style="width:44px;font-size:17px">${cur||"·"}</button></div>`}).join("")}
 P.innerHTML=h}
function colRow(k,t){return `<div class="row"><span>${LB[k]}</span><button class="sw ${T.col[S.mode][k]?"":"lk"}" style="background:${t[k]}" data-pk="${k}">${warn(k,t)?'<i class="warn"></i>':""}</button><button class="btn" data-follow="${k}" ${T.col[S.mode][k]?"":"disabled"} style="margin-left:auto">🔗</button></div>`}
function palCols(t){const p=BASES[T.base].pal;return[...p,"#ffffff","#1a1a1a",...p.map(c=>mix(c,"#ffffff",.75))]}
function warn(k,t){const pr={fg:["surface","bg"],muted:["surface"],onAccent:["accent"],accent:["surface"]};return(pr[k]||[]).some(b=>cr(t[k],t[b])<(k=="accent"?2:3))}
function rng(k,n,a,b,v,g){return `<div class="row"><span>${n}</span><input type="range" min="${a}" max="${b}" value="${v}" data-rng="${k}" data-g="${g}"><b style="width:34px;text-align:right">${v}</b></div>`}
/* ---------- 이벤트 ---------- */
$("#base").innerHTML=Object.entries(BASES).map(([k,b])=>`<button data-b="${k}">${b.nm}</button>`).join("");
$("#base").onclick=e=>{const b=e.target.closest("[data-b]");if(!b||b.dataset.b==T.base)return;snap();T.base=b.dataset.b;T.col={light:{},dark:{}};paint();toast("시작 팔레트를 바꿨어요")};
$("#mode").onclick=e=>{const b=e.target.closest("[data-m]");if(b){S.mode=b.dataset.m;paint()}};
$("#app").onclick=e=>{const el=e.target.closest("[data-k]");if(!el)return;e.stopPropagation();S.sel=el.dataset.k;S.pickK=null;const z=ZONE[S.sel];
 if(!(S.tab=="색"||(S.tab=="이미지"&&z.img)||(S.tab=="글꼴"&&z.font)||(S.tab=="아이콘"&&z.icon)||S.tab=="모양"))S.tab="색";paint()};
$("#app").oncontextmenu=e=>{const el=e.target.closest("[data-k]");if(!el)return;e.preventDefault();S.sel=el.dataset.k;paint();
 ctx(e.clientX,e.clientY,[["색 바꾸기",()=>{S.tab="색";paint()}],["이미지 넣기",()=>{S.tab="이미지";paint()},!ZONE[S.sel].img],["글꼴",()=>{S.tab="글꼴";paint()},!ZONE[S.sel].font],null,["이 부분 처음대로",()=>resetZone()]])};
function resetZone(){snap();const z=ZONE[S.sel];z.cols.forEach(k=>delete T.col[S.mode][k]);if(z.img)T.img[z.img]="";paint();toast(ZONE[S.sel].t+" 처음대로")}
const P=$("#panel");
P.onclick=e=>{const g=e.target.closest("[data-tab],[data-pk],[data-k2],[data-c],[data-follow],[data-iset],[data-icfor]");if(!g)return;const d=g.dataset;
 if(d.tab){S.tab=d.tab;panel()}
 else if(d.pk){S.pickK=d.pk;$$("#panel [data-pk]").forEach(b=>b.style.outline=b==g?"2px solid var(--ui-ac)":"");$("#free").value=full()[d.pk]}
 else if(d.k2){const z=Object.entries(ZONE).find(([,v])=>v.cols.includes(d.k2));if(z)S.sel=z[0];S.pickK=d.k2;paint();const b=$(`#panel [data-pk="${d.k2}"]`);if(b)b.style.outline="2px solid var(--ui-ac)"}
 else if(d.c){setCol(d.c)}
 else if(d.follow){snap();delete T.col[S.mode][d.follow];paint()}
 else if(d.iset){snap();T.icon.set=d.iset;T.icon.own={};paint()}
 else if(d.icfor){const r=g.getBoundingClientRect();icPop(d.icfor,r.left,r.bottom+4)}};
P.oninput=e=>{const g=e.target;if(g.id=="free")setCol(g.value,1);
 if(g.dataset.rng){if(!S.drag){snap();S.drag=1}T[g.dataset.g][g.dataset.rng]=+g.value;g.nextElementSibling.textContent=g.value;paint()}};
P.onchange=e=>{const g=e.target;S.drag=0;if(g.dataset.font){snap();T.font[g.dataset.font]=g.value;paint()}
 if(g.dataset.img){const f=g.files[0];if(!f)return;shrink(f,g.dataset.img=="deco"?400:1200).then(u=>{snap();T.img[g.dataset.img]=u;paint()})}};
P.oncontextmenu=e=>{const th=e.target.closest("[data-imgctx]");if(!th)return;e.preventDefault();const k=th.dataset.imgctx;
 ctx(e.clientX,e.clientY,[["바꾸기",()=>{const i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=()=>shrink(i.files[0],k=="deco"?400:1200).then(u=>{snap();T.img[k]=u;paint()});i.click()}],null,["지우기",()=>{snap();T.img[k]="";paint();toast("이미지를 지웠어요")}]])};
P.addEventListener("dblclick",e=>{const th=e.target.closest("[data-imgctx]");if(th){snap();T.img[th.dataset.imgctx]="";paint();toast("이미지를 지웠어요")}});
function setCol(c,live){const k=S.pickK||ZONE[S.sel].cols[0];if(!live||!S.lc){snap();S.lc=1;setTimeout(()=>S.lc=0,600)}T.col[S.mode][k]=c;paint();if(S.pickK){const b=$(`#panel [data-pk="${k}"]`);if(b)b.style.outline="2px solid var(--ui-ac)"}}
function shrink(f,max){return new Promise(r=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);r(c.toDataURL(f.type=="image/png"?"image/png":"image/jpeg",.82))};im.src=URL.createObjectURL(f)})}
function icPop(k,x,y){const c=$("#ctx");c.innerHTML=`<div class="ics">${ICPICK.map(i=>`<button data-ic2="${i}">${i}</button>`).join("")}</div><hr><button data-ic2="__">세트 따라가기</button>`;place(c,x,y);
 c.onclick=e=>{const b=e.target.closest("[data-ic2]");if(!b)return;snap();if(b.dataset.ic2=="__")delete T.icon.own[k];else T.icon.own[k]=b.dataset.ic2;hide();paint()}}
function ctx(x,y,items){const c=$("#ctx");c.innerHTML=items.map((it,i)=>it?`<button data-i="${i}" ${it[2]?"disabled style='opacity:.4'":""}>${it[0]}</button>`:"<hr>").join("");place(c,x,y);c.onclick=e=>{const b=e.target.closest("[data-i]");if(b&&!b.disabled){hide();items[b.dataset.i][1]()}}}
function place(c,x,y){c.classList.add("on");c.style.left=Math.min(x,innerWidth-c.offsetWidth-8)+"px";c.style.top=Math.min(y,innerHeight-c.offsetHeight-8)+"px"}
function hide(){$("#ctx").classList.remove("on")}
document.addEventListener("click",e=>{if(!e.target.closest("#ctx,[data-icfor]"))hide()});
/* 이번 주 달력 */
$("#cal").innerHTML=["일","월","화","수","목","금","토"].map((d,i)=>`<div class="d ${i==4?"today":""}" ${i==4?'data-k="today"':""}>${26+i>31?26+i-31:26+i}${i==1||i==4?`<span class="chip" data-k="chip">${i==1?"커미션 회의":"채색 마감"}</span>`:""}</div>`).join("");
/* 되돌리기 */
let last=null;function toast(m){last=hist[hist.length-1];$("#tmsg").textContent=m;$("#toast").classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>$("#toast").classList.remove("on"),3500)}
$("#tundo").onclick=()=>{undo();$("#toast").classList.remove("on")};
function undo(){if(!hist.length)return;T=JSON.parse(hist.pop());paint()}
$("#undo").onclick=undo;
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key=="z"){e.preventDefault();undo()}});
/* ---------- 테마 코드 ---------- */
const enc=o=>"DBT1."+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec=s=>JSON.parse(decodeURIComponent(escape(atob(s.trim().replace(/^DBT1\./,"")))));
function makeCode(){return enc({v:1,who:$("#who").value.trim(),name:$("#tname").value.trim(),id:Math.random().toString(36).slice(2,8).toUpperCase(),at:new Date().toISOString().slice(0,10),theme:T})}
$("#exp").onclick=()=>{$("#mExp").classList.add("on");$("#code").value=makeCode()};
["who","tname"].forEach(i=>$("#"+i).oninput=()=>$("#code").value=makeCode());
$("#copy").onclick=()=>{navigator.clipboard?.writeText($("#code").value);$("#code").select();toast("복사했어요")};
$("#imp").onclick=()=>{$("#icode").value="";$("#mImp").classList.add("on")};
$("#apply").onclick=()=>{try{const o=dec($("#icode").value);snap();T=Object.assign(blank(),o.theme);$("#mImp").classList.remove("on");paint();toast((o.name||"테마")+" 적용")}catch(_){$("#icode").style.borderColor="#e03131"}};
$$("[data-close]").forEach(b=>b.onclick=()=>b.closest(".modal").classList.remove("on"));
/* 폭 맞추기 (폰에서도 PC 화면을 줄여서) */
function fit(){const s=Math.min(1,innerWidth/1280),r=$("#root");r.style.transform=`scale(${s})`;$("#fitwrap").style.height=r.offsetHeight*s+"px"}
addEventListener("resize",fit);paint();fit();
</script></body></html>
