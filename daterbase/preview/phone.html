<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daterbase 폰 미리보기</title>
<style>
:root{--bg:#eef2ef;--fg:#1f2a24;--muted:#76837b;--card:#fff;--line:#dbe4de;--ac:#16865a}
@media (prefers-color-scheme:dark){:root{--bg:#141816;--fg:#e8eee9;--muted:#8b968f;--card:#1e2420;--line:#2c3430}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}
.bar{position:fixed;left:0;right:0;top:0;height:56px;display:flex;align-items:center;gap:10px;padding:0 18px;z-index:5}
.bar b{font-size:15px;font-weight:800;margin-right:6px}
.bar select,.bar button{font:inherit;font-size:13px;font-weight:600;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;height:34px;padding:0 12px;cursor:pointer}
.bar button:hover,.bar select:hover{border-color:var(--ac)}
.bar .sp{flex:1}
.bar small{color:var(--muted);font-size:12px}
.stage{position:absolute;inset:56px 0 0 0}
.wrap{position:absolute;left:50%;top:50%;transform-origin:center center}
.phone{position:relative;border-radius:var(--r);background:#111;padding:12px;box-shadow:0 0 0 2px #2a2a2a inset,0 40px 80px -30px rgba(0,0,0,.45)}
.screen{position:relative;width:var(--w);height:var(--h);border-radius:calc(var(--r) - 12px);overflow:hidden;background:#fff}
.status{position:absolute;left:0;right:0;top:0;height:var(--st);display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 34px;font-size:15px;font-weight:700;color:#111;z-index:2;pointer-events:none;background:var(--stbg,#fff);transition:background .2s}
.status.dark{color:#fff}
.island{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;z-index:3}
.icons{display:flex;gap:6px;align-items:center}
.icons i{display:block;background:currentColor;border-radius:2px}
iframe{position:absolute;left:0;right:0;bottom:0;top:var(--st);width:100%;height:calc(100% - var(--st));border:0;background:#fff}
.home{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:rgba(0,0,0,.75);z-index:3;pointer-events:none}
.phone.se .island{display:none}.phone.se .home{display:none}
</style>
</head>
<body>
<div class="bar">
  <b>Daterbase 폰 미리보기</b>
  <select id="dev">
    <option value="393,852,59,55,pro">iPhone 15 / 16</option>
    <option value="430,932,59,55,pro">iPhone Pro Max</option>
    <option value="375,812,47,52,pro">iPhone 13 mini</option>
    <option value="375,667,20,40,se">iPhone SE</option>
  </select>
  <button id="reload" type="button">새로고침</button>
  <button id="open" type="button">새 탭에서 열기</button>
  <span class="sp"></span>
  <small>내 데이터 그대로 보여요 · 여기서 고친 것도 저장돼요</small>
</div>
<div class="stage"><div class="wrap" id="wrap">
  <div class="phone" id="phone">
    <div class="screen">
      <div class="status" id="status"><span id="clock">9:41</span><span class="icons"><i style="width:17px;height:11px;opacity:.9"></i><i style="width:15px;height:11px;opacity:.9;border-radius:6px 6px 2px 2px"></i><i style="width:25px;height:12px;border-radius:4px"></i></span></div>
      <div class="island"></div>
      <iframe id="app" src="./index.html" title="Daterbase"></iframe>
      <div class="home"></div>
    </div>
  </div>
</div></div>
<script>
(function(){
  var dev=document.getElementById('dev'),phone=document.getElementById('phone'),wrap=document.getElementById('wrap'),app=document.getElementById('app'),st=document.getElementById('status');
  try{var sv=localStorage.getItem('dbPhoneDev');if(sv)dev.value=sv}catch(e){}
  function apply(){
    var p=dev.value.split(','),w=+p[0],h=+p[1];
    phone.style.setProperty('--w',w+'px');phone.style.setProperty('--h',h+'px');phone.style.setProperty('--st',p[2]+'px');phone.style.setProperty('--r',p[3]+'px');
    phone.className='phone '+p[4];
    try{localStorage.setItem('dbPhoneDev',dev.value)}catch(e){}
    fit();
  }
  function fit(){
    var r=phone.getBoundingClientRect(),ph=phone.offsetHeight,pw=phone.offsetWidth,aw=innerWidth-40,ah=innerHeight-56-24;
    var s=Math.min(1,aw/pw,ah/ph);wrap.style.transform='translate(-50%,-50%) scale('+s+')';
  }
  function clock(){var d=new Date();document.getElementById('clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')}
  // 상태바 색을 앱 배경색에 맞춤
  function tint(){
    try{
      var doc=app.contentDocument;if(!doc||!doc.body)return;
      var m=doc.querySelector('meta[name="theme-color"]'),c=(m&&m.content)||getComputedStyle(doc.body).backgroundColor;
      st.style.setProperty('--stbg',c);
      var x=document.createElement('div');x.style.color=c;document.body.appendChild(x);var rgb=getComputedStyle(x).color.match(/\d+/g)||[255,255,255];x.remove();
      var l=(0.299*rgb[0]+0.587*rgb[1]+0.114*rgb[2]);st.classList.toggle('dark',l<140);
    }catch(e){}
  }
  dev.addEventListener('change',apply);
  document.getElementById('reload').addEventListener('click',function(){app.contentWindow.location.reload()});
  document.getElementById('open').addEventListener('click',function(){window.open('./index.html','_blank')});
  addEventListener('resize',fit);
  apply();clock();setInterval(clock,20000);setInterval(tint,800);
})();
</script>
</body>
</html>
